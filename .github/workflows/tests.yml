---
name: Tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: true

      - name: Run Ruff lint
        run: uvx ruff@0.13.3 check .

      - name: Check Ruff formatting
        run: uvx ruff@0.13.3 format --check .

      - name: Type-check input readers
        run: >
          uvx --with pandas-stubs --with types-seaborn mypy==1.18.2
          --ignore-missing-imports --no-strict-optional data_readers.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: >
          uv run --frozen pytest --tb=short -q --cov=.
          --cov-report=xml:coverage.xml
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: CLI smoke test with XLS inputs
        run: >
          uv run --frozen python power_flow_simulator.py
          --production-file tests/fixtures/production.xls
          --consumption-file tests/fixtures/smart_meter.xls
          --solar-power 5 --inverter-power 5 --battery-capacity 5
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          MPLBACKEND: Agg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          use_oidc: true

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          load: true
          tags: solar-battery-simulator:ci

      - name: Check image can read CSV and Excel inputs
        run: >
          docker run --rm -v "$PWD/tests/fixtures:/fixtures:ro"
          solar-battery-simulator:ci uv run --no-sync python -c
          "import gui, data_readers as d;
          print(d.load_consumption('/fixtures/smart_meter.xls').shape,
          d.load_production('/fixtures/production.xls').shape)"

      - name: Validate compose config
        run: docker compose config --quiet
