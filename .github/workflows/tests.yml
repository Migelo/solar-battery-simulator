name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Run Ruff lint
        run: uvx ruff@0.13.3 check .

      - name: Check Ruff formatting
        run: uvx ruff@0.13.3 format --check .

  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: uv sync --extra test
      
      - name: Run tests
        run: uv run pytest --tb=short -v
