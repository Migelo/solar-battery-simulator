---
name: Tests

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: true

      - name: Run Ruff lint
        run: uvx ruff@0.13.3 check .

      - name: Check Ruff formatting
        run: uvx ruff@0.13.3 format --check .

      - name: Type-check input readers
        run: >
          uvx --with pandas-stubs --with types-seaborn mypy==1.18.2
          --ignore-missing-imports --no-strict-optional src/solar_battery_simulator/data_readers.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra test
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run tests with coverage
        run: >
          uv run --frozen pytest --tb=short -q --cov=solar_battery_simulator
          --cov-report=xml:coverage.xml
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: CLI smoke test with XLS inputs
        run: >
          uv run --frozen solar-sim
          --production-file tests/fixtures/production.xls
          --consumption-file tests/fixtures/smart_meter.xls
          --solar-power 5 --inverter-power 5 --battery-capacity 5
        env:
          UV_PYTHON: ${{ matrix.python-version }}
          MPLBACKEND: Agg

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python-${{ matrix.python-version }}
          fail_ci_if_error: false
          use_oidc: true

  windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "latest"
          enable-cache: true

      - name: Run tests
        run: uv run --frozen --extra test pytest --tb=short -q
        env:
          MPLBACKEND: Agg

      - name: Launcher starts the GUI
        shell: pwsh
        env:
          GUI_OPEN_BROWSER: "0"
          PRICE_CACHE_AUTO_UPDATE: "0"
        run: |
          if ((Get-Content -Raw windows\start_windows.bat) -notmatch "`r`n") { throw "start_windows.bat lost its CRLF line endings" }
          $p = Start-Process cmd.exe -ArgumentList '/c', 'windows\start_windows.bat' -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 120 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080).StatusCode -eq 200 } catch {}
          }
          taskkill /T /F /PID $p.Id | Out-Null
          if (-not $ok) { throw "GUI did not answer on http://127.0.0.1:8080" }

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: solar-battery-simulator:ci

      - name: Check image can read CSV and Excel inputs
        run: >
          docker run --rm -v "$PWD/tests/fixtures:/fixtures:ro"
          solar-battery-simulator:ci uv run --no-sync python -c
          "from solar_battery_simulator import gui, data_readers as d;
          print(d.load_consumption('/fixtures/smart_meter.xls').shape,
          d.load_production('/fixtures/production.xls').shape)"

      - name: Validate compose config
        run: docker compose config --quiet
